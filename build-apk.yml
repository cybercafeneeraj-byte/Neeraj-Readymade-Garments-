name: Build Neeraj Garments APK
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Find and extract project ZIP
        shell: bash
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -type f -iname '*NeerajGarmentsAndroidProject*.zip' -print -quit)
          if [ -z "$ZIP_FILE" ]; then echo 'Project ZIP not found. Upload NeerajGarmentsAndroidProject.zip to repository root.'; exit 1; fi
          mkdir -p work
          unzip -q "$ZIP_FILE" -d work
          PROJECT_DIR=$(find work -type f -name settings.gradle -print -quit | xargs -r dirname)
          if [ -z "$PROJECT_DIR" ]; then echo 'settings.gradle not found inside ZIP'; exit 1; fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle -p "$PROJECT_DIR" assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NeerajGarments-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
